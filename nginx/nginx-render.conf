worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # Cache configuration for proxied requests (tiles and API)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=geo_cache:10m max_size=500m inactive=7d use_temp_path=off;

    server {
        listen ${PORT};
        server_name _;
        
        # Root directory for frontend static files
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Block access to hidden/sensitive files and common secrets.
        # Prevent SPA fallback (/index.html) from returning 200 for probe paths
        # like /.env, /.git/config, /backend/.env, etc.
        location ~* (^|/)\.(?!well-known(?:/|$)) {
            return 404;
        }
        location ~* (^|/)(?:\.env(?:\..*)?|\.git|\.svn|\.hg|\.bzr|id_rsa|composer\.(?:json|lock)|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Dockerfile|docker-compose\.ya?ml|\.htaccess|\.htpasswd)$ {
            return 404;
        }
        location ~* (^|/)(?:backup|backups|config|debug|server|src|core|app|web|laravel)(?:/|$).*\.(?:env|ini|log|sql|bak|old|save)$ {
            return 404;
        }

        # Frontend static files (SPA routing)
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Admin panel – serve admin.html per tutti i path sotto /admin
        location /admin {
            try_files $uri /admin.html;
            expires -1;
            add_header Cache-Control "no-store";
        }

        # Proxy for geo.parabellumthinktank.com (Lizmap WMS/WFS — no CORS headers on origin)
        location /lizmap/ {
            proxy_pass https://geo.parabellumthinktank.com/index.php/lizmap/;
            proxy_set_header Host geo.parabellumthinktank.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            # Add CORS headers that the origin server omits
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            # Handle preflight requests
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                return 204;
            }

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Proxy for swisstopo API3 service (search, identify, height, etc.)
        location /api3-geo/ {
            proxy_pass https://api3.geo.admin.ch/;
            proxy_set_header Host api3.geo.admin.ch;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            # Enable brief caching for API responses
            proxy_cache geo_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Backend API proxy
        # Preserves /api/ prefix — FastAPI routes all start with /api/
        location /api/tracking/ws {
            proxy_pass https://api.intelligeo.net/api/tracking/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host api.intelligeo.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass https://api.intelligeo.net/api/;
            proxy_http_version 1.1;
            proxy_set_header Host api.intelligeo.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            # No caching for API
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # QWC2 dynamic themes.json — proxied to backend, never cached
        location = /themes.json {
            proxy_pass https://api.intelligeo.net/themes.json;
            proxy_set_header Host api.intelligeo.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            # Never cache — themes change on every project upload
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Proxy Swagger/ReDoc/OpenAPI from backend
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass https://api.intelligeo.net;
            proxy_set_header Host api.intelligeo.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }

        # Static assets (longer cache)
        location ~* ^(?!/lizmap/|/api3-geo/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
