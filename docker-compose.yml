# Dufour.app – Full Stack Docker Compose
# ========================================
# Services:
#   frontend     – QWC2 (Nginx + built React app)
#   backend      – FastAPI middleware + QGIS Server + milsymbol
#   postgres     – PostgreSQL 16 + PostGIS (local dev; prod uses alwaysdata)
#
# Traccar tracking is provided by the external API at https://traccar.intelligeo.net
# (no local Traccar container – configure TRACCAR_USER / TRACCAR_PASSWORD in .env)
#
# Quick start (dev):
#   docker compose up --build
#
# Then open http://localhost:10080 for the frontend.

version: "3.9"

services:

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGIS_DB:-intelligeo_dufour}
      POSTGRES_USER: ${POSTGIS_USER:-intelligeo_dufour}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER:-intelligeo_dufour}"]
      interval: 10s
      retries: 5
    networks:
      - dufour_net

  # ── Dufour backend (FastAPI + QGIS Server + milsymbol) ───────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${PORT:-10000}
      POSTGIS_HOST: ${POSTGIS_HOST:-postgres}
      POSTGIS_PORT: ${POSTGIS_PORT:-5432}
      POSTGIS_DB: ${POSTGIS_DB:-intelligeo_dufour}
      POSTGIS_USER: ${POSTGIS_USER:-intelligeo_dufour}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD:-changeme}
      QGIS_SERVER_URL: http://localhost:8080
      MILSYMBOL_SERVER_URL: http://localhost:2525
      MILSYMBOL_PORT: "2525"
      # ── Traccar integration (external: https://traccar.intelligeo.net) ──
      TRACCAR_URL: ${TRACCAR_URL:-https://traccar.intelligeo.net}
      TRACCAR_USER: ${TRACCAR_USER:-admin}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-admin}
      # ─────────────────────────────────────────────────────────────
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dufour_net

  # ── Dufour frontend (Nginx + QWC2 React build) ───────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT:-10080}
    ports:
      - "10080:${FRONTEND_PORT:-10080}"
    depends_on:
      - backend
    networks:
      - dufour_net

volumes:
  postgres_data:

networks:
  dufour_net:
    driver: bridge
